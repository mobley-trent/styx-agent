name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: vet / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

      # Pinned to v2.15: goreleaser v2.16 made the `brews` deprecation a hard
      # `check` error. styx keeps a formula tap deliberately (spec §12.1): a
      # cask would impose the macOS quarantine bit on a notarization-less
      # binary. The release job still uses the latest v2, which publishes the
      # formula with a deprecation warning. Migrate to homebrew_casks together
      # with macOS signing/notarization.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.15.0"
          args: check

      - name: Test
        run: go test -race ./...

  # RELEASING.md: the changelog is the source of truth, and an entry ships in
  # the same change that needs it. Only meaningful for a pull request — there
  # is no base revision to compare against on a push to main.
  changelog:
    name: changelog entry
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs the pull request's base against its head, so both
          # revisions have to be present: the default shallow clone has neither.
          fetch-depth: 0

      - name: "Require an [Unreleased] entry for product changes"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-changelog.sh "$BASE_SHA"

  egress:
    name: container egress (root docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables

      # The hermetic egress tests need root to program nft/iptables. They skip
      # gracefully anywhere privileges are absent, so the main gate still runs
      # them (as a no-op) and this job is what actually exercises enforcement.
      - name: Egress tests
        run: sudo env "PATH=$PATH" "GOCACHE=/tmp/gocache" "GOPATH=/tmp/gopath" go test ./internal/containerlayer/ -run TestHermeticEgress -v -count=1 -timeout 10m
